name: Container build
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t finsight-api:test .
      - name: Build frontend/reverse-proxy image
        run: docker build -f frontend/Dockerfile --build-arg VITE_FINSIGHT_AUTH_MODE=users -t finsight-web:test .
      - name: Check Compose syntax
        env:
          FINSIGHT_DOMAIN: finance.example.com
          FINSIGHT_DATA_PATH: /tmp/finsight-compose-test
          FINSIGHT_BACKUP_PATH: /tmp/finsight-compose-backups
        run: docker compose -f compose.production.yml config --quiet
