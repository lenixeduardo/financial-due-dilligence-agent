name: PostgreSQL integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: test_only_not_production
          POSTGRES_DB: finsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      FINSIGHT_TEST_DATABASE_URL: postgresql://finsight:test_only_not_production@localhost:5432/finsight_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests/test_database_integration.py backend/tests/test_retrieval_db.py
